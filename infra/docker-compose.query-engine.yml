services:
  metastore_db:
    image: postgres:18
    restart: unless-stopped
    container_name: postgres_metastore_db
    hostname: postgres
    environment:
      POSTGRES_DB: 'metastore_database'
      POSTGRES_USER: 'hive'
      POSTGRES_PASSWORD: 'password'
    volumes:
      - metastore_db_vol:/var/lib/postgresql
    ports:
      - '5433:5432'
    networks:
      - data-platform

  hive-metastore:
    image: apache/hive:3.1.3
    depends_on:
      - metastore_db
    restart: unless-stopped
    container_name: hive-metastore
    environment:
      DB_DRIVER: postgres
      SERVICE_NAME: 'metastore'
      HADOOP_OPTIONAL_TOOLS: hadoop-aws
      # IS_RESUME: 'true'
      SERVICE_OPTS: >
        -Xmx1G
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://metastore_db:5432/metastore_database
        -Djavax.jdo.option.ConnectionUserName=hive
        -Djavax.jdo.option.ConnectionPassword=password
    ports:
        - '9083:9083'
    volumes:
        - ./hive/jars/postgresql-42.7.10.jar:/opt/hive/lib/postgresql-42.7.10.jar
        - ./hive/conf:/opt/hive/conf
    networks:
      - data-platform
  trino:
    image: trinodb/trino:481
    container_name: trino
    ports:
      - '8080:8080'
    volumes:
      - './trino/catalog:/etc/trino/catalog:ro'
    depends_on:
      - hive-metastore
    networks:
      - data-platform

networks:
  data-platform:
    external: true

volumes:
  metastore_db_vol: