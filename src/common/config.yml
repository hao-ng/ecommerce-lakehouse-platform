bronze:
  clickstream:
    type: append
    trigger: 10 seconds

  customers:
    type: cdc
    trigger: 10 seconds

  products:
    type: cdc
    trigger: 10 seconds

  transactions:
    type: cdc
    trigger: 10 seconds

silver:
  customers:
    source_key_cols: [customer_id]
    cast:
      epoch_days: [birthdate, first_join_date]

  products:
    source_key_cols: [id]

  transactions:
    source_key_cols: [id]
    cast:
      timestamp: [created_at, shipment_date_limit]
    children:
      transaction_items:
        source_key_cols: [booking_id]
        merge_key_cols: [booking_id, product_id]

  clickstream:
    source_key_cols: ["event_id"]
    children:
      clickstream_add_to_cart_events:
        source_key_cols: ["event_id"]
      clickstream_booking_events:
        source_key_cols: ["event_id"]
      clickstream_search_events:
        source_key_cols: ["event_id"]
      clickstream_add_promo_events:
        source_key_cols: ["event_id"]
